<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>Add Author</h1>
    <br>
    <form method="post" action="/author/add" th:object="${newAuthor}">
        Name
        <input type="text" th:field="*{name}"> <br>
        Active years
        <input type="text" th:field="*{activeYears}"> <br>
        Awards
        <input type="number" th:field="*{awardsCount}"> <br>
        <br>
        <button>Add</button>
    </form>
</body>
</html>
