<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <form method="get" action="/fine/loc">
        <h1>Lọc theo amount</h1>
        Tiền từ: <input type="number" name="min" step="0.01">
        đến: <input type="number" name="max" step="0.01">
        <button type="submit">Lọc tiền phạt</button>
    </form>
    <br>
    <h3 th:if="${#lists.isEmpty(listFine)}" style="color: red;">Danh sách bị rỗng, phải thêm dữ liệu vào</h3>
    <table border="1" th:unless="${#lists.isEmpty(listFine)}">
        <thead>
            <tr>
                <th>ID</th>
                <th>Amount</th>
                <th>Reason</th>
                <th>Issued date</th>
                <th>Due date</th>
                <th>Status</th>
                <th>Loan</th>
                <th>Activites</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="fine: ${listFine}">
                <td th:text="${fine.id}"></td>
                <td th:text="${fine.amount}"></td>
                <td th:text="${fine.reason == true ? 'Late' : 'lost '}"></td>
                <td th:text="${fine.issuedDate}"></td>
                <td th:text="${fine.dueDate}"></td>
                <td th:text="${fine.status == true ? 'Active' : 'Completed'}"></td>
                <td th:text="${fine.loan.id}"></td>
                <td>
                    <a th:href="@{'/fine/delete/' + ${fine.id}}">Delete</a>
                    <a th:href="@{'/fine/detail/' + ${fine.id}}">Detail</a>
                </td>
            </tr>
        </tbody>
    </table>
    <br>
    <form method="get" action="/fine/add">
        <button>Add</button>
    </form>

    <form method="get" action="logout">
        <button>Đăng xuất</button>
    </form>
</body>
</html>
