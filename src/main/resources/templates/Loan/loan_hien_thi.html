<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <form method="get" action="/loan/search">
        <h1>Find by status</h1>
        <input type="text" name="status">
        <button>Search</button>
    </form>
    <br>
    <form method="get" action="/loan/loc">
        <h1>Lọc theo loan date</h1>
        Từ ngày: <input type="date" name="start">
        Đến ngày: <input type="date" name="end">
        <button type="submit">Lọc ngày mượn</button>
    </form>
    <br>
    <h3 th:if="${#lists.isEmpty(listLoan)}" style="color: red;">Danh sách bị rỗng, phải thêm dữ liệu vào</h3>
    <table border="1" th:unless="${#lists.isEmpty(listLoan)}">
        <thead>
            <tr>
                <th>ID</th>
                <th>Loan date</th>
                <th>Due date</th>
                <th>Return date</th>
                <th>Status</th>
                <th>Total books</th>
                <th>Over due days</th>
                <th>Fine amount</th>
                <th>Reminder sent</th>
                <th>User id</th>
                <th>Activities</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="loan: ${listLoan}">
                <td th:text="${loan.id}"></td>
                <td th:text="${loan.loanDate}"></td>
                <td th:text="${loan.dueDate}"></td>
                <td th:text="${loan.returnDate}"></td>
                <td th:text="${loan.status}"></td>
                <td th:text="${loan.totalBooks}"></td>
                <td th:text="${loan.overdueDays}"></td>
                <td th:text="${loan.fineAmount}"></td>
                <td th:text="${loan.reminderSent == true ? 'Sent' : 'Not sent'}"></td>
                <td th:text="${loan.user.name}"></td>
                <td>
                    <a th:href="@{'/loan/delete/' + ${loan.id}}">Delete</a>
                    <a th:href="@{'/loan/detail/' + ${loan.id}}">Detail</a>
                </td>
            </tr>
        </tbody>
    </table>
    <br>
    <form method="get" action="/loan/add">
        <button>Add</button>
    </form>
</body>
</html>
